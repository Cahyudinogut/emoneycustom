var l=P.filter(function(p){return p.c==k&&(k!="emoney"||sub=="Semua"||p.sub==sub)});
return t+'<div class="grid">'+l.map(card).join("")+'</div>'}
function search(){
var l=P.filter(function(p){return (p.n+" "+p.lb).toLowerCase().indexOf(q)>-1});
var v=V.map(function(x,i){return i}).filter(function(i){return (V[i].n+" "+GN[V[i].g]+" "+PN[V[i].t]+" ulasan video").toLowerCase().indexOf(q)>-1});
return (l.length?'<h2>Produk ('+l.length+')</h2><div class="grid">'+l.map(card).join("")+'</div>':'')
+(v.length?'<h2>Video Ulasan ('+v.length+')</h2><div class="sc">'+v.map(function(i){return '<button class="vr" data-a="vid" data-i="'+i+'">'+vtile(i)+'<div>'+V[i].n+'<br><small>'+PN[V[i].t]+' · '+GN[V[i].g]+'</small></div></button>'}).join("")+'</div>':'')
+(l.length+v.length?'':'<div class="empty">Tidak ditemukan 🐸</div>')}
function route(top){
var h=location.hash.slice(1)||"home",k=CATS.some(function(c){return c[0]==h})?h:"home";
$("#app").innerHTML=q?search():(k=="home"?home():catv(k));
$("#n1").className=k=="home"?"on":"";$("#n2").className=k!="home"?"on":"";
clearInterval(bt);var b=$("#bn1");
if(b)bt=setInterval(function(){b.scrollTo({left:((Math.round(b.scrollLeft/b.clientWidth)+1)%2)*b.clientWidth,behavior:"smooth"})},3500);
if(top)window.scrollTo(0,0)}
function sheet(h){$("#sh").innerHTML='<button class="x" data-a="close" aria-label="Tutup">×</button>'+h;$("#ov").hidden=false}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1600)}
function ph(){var p=sel.p,b=base(p,sel.s),v=price(p,sel.s);return fmt(v)+(p.pm&&b?'<s>'+fmt(b)+'</s> <em class="tg" style="position:static;display:inline-block">'+PL+'</em>':'')}
// media produk: isi p.m = [{t:"i",s:"images/x.jpg"},{t:"v",s:"video/x.mp4"}]; tanpa p.m tampil 1 slide placeholder
function gal(p){var m=p.m||[{t:"i"}];
return '<div class="gw"><div class="gal">'+m.map(function(x){var c=x.t=="v"?'<video src="'+x.s+'" controls playsinline muted loop></video>':(x.s?'<img src="'+x.s+'" alt="">':'<span>'+p.e+'</span>');return '<div class="sl" style="--h:'+p.h+'">'+c+'</div>'}).join("")+'</div>'+(m.length>1?'<span class="cnt" id="cnt">1/'+m.length+'</span>':'')+'</div>'}
function det(i){var p=byId(i);sel={p:p,s:p.g.map(function(){return 0})};
sheet(gal(p)+'<h2 style="margin:0">'+p.n+'</h2><small>'+p.lb+'</small><div class="pr big" id="dp">'+ph()+'</div>'
+p.g.map(function(g,gi){return '<div class="g"><b>'+g.n+'</b>'+(g.h?' <small>('+g.h+')</small>':'')+'<div class="vs">'+g.o.map(function(o,oi){return '<button class="vc'+(oi?'':' on')+'" data-a="opt" data-g="'+gi+'" data-i="'+oi+'">'+o+'</button>'}).join("")+'</div></div>'}).join("")
+'<div class="row"><button class="btn o" data-a="add">+ Keranjang</button><button class="btn" data-a="buy">Beli Langsung</button></div>');
var g=$(".gal"),c=$("#cnt");if(c)g.addEventListener("scroll",function(){c.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+"/"+g.children.length})}
function vid(i){var v=V[i],t=v.t=="t",src=t?"https://www.tiktok.com/embed/v2/"+v.id:"https://www.instagram.com/p/"+v.id+"/embed",u=t?"https://www.tiktok.com/@desainerpercetakan/video/"+v.id:"https://www.instagram.com/p/"+v.id+"/";
sheet('<h2 style="margin:0 0 2px;padding-right:34px">'+v.n+'</h2><small>'+PN[v.t]+' · '+GN[v.g]+'</small><div class="vf"><iframe src="'+src+'" allow="autoplay; encrypted-media; fullscreen" allowfullscreen loading="lazy"></iframe></div><div class="row"><a class="btn" href="'+u+'" target="_blank" rel="noopener">Lihat di '+PN[v.t]+'</a></div>')}
function line(it){var p=byId(it.id);return{p:p,u:price(p,it.s),v:p.g.map(function(g,i){return g.o[it.s[i]]}).join(" · ")}}
function save(){try{localStorage.setItem("fs_cart2",JSON.stringify(cart))}catch(e){}var n=cart.reduce(function(a,i){return a+i.q},0),b=$("#bd");b.textContent=n||"";b.dataset.n=n}
function add(){var k=sel.s.join(),i=cart.find(function(x){return x.id==sel.p.id&&x.s.join()==k});if(i)i.q++;else cart.push({id:sel.p.id,s:sel.s.slice(),q:1});save()}
function msg(its){var t=0,u=0;var s=its.map(function(it,n){var l=line(it);if(l.u)t+=l.u*it.q;else u=1;
return (n+1)+". "+l.p.n+(l.v?"\n   Varian: "+l.v.replace(/ · /g,", "):"")+"\n   "+it.q+" x "+(l.u?fmt(l.u)+" = "+fmt(l.u*it.q):"harga dikonfirmasi admin")+(l.p.pm?" (promo "+PL+")":"")}).join("\n");
return "Halo Frogress Shop, saya mau pesan:\n\n"+s+"\n\nTotal: "+fmt(t)+(u?" (belum termasuk item yang harganya dikonfirmasi admin)":"")+"\n\nTerima kasih!"}
function wa(its){window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg(its)),"_blank")}
function cartView(){
if(!cart.length){sheet('<h2 style="margin:0">Keranjang</h2><div class="empty">Keranjang masih kosong 🛒</div>');return}
var t=0;var h=cart.map(function(it,k){var l=line(it);t+=l.u*it.q;
return '<div class="it"><div class="th" style="--h:'+l.p.h+'">'+l.p.e+'</div><div>'+l.p.n+'<br><small>'+(l.v?l.v+' · ':'')+fmt(l.u)+'</small></div><div class="q"><button data-a="dec" data-k="'+k+'">−</button>'+it.q+'<button data-a="inc" data-k="'+k+'">+</button></div></div>'}).join("");
sheet('<h2 style="margin:0 0 6px">Keranjang</h2>'+h+'<div class="tot"><span>Total</span><span class="pr">'+fmt(t)+'</span></div><div class="row"><button class="btn" data-a="co">Checkout via WhatsApp</button></div>')}
document.addEventListener("click",function(e){
if(e.target.id=="ov"){$("#ov").hidden=true;$("#sh").innerHTML="";return}
var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a;
if(a=="det")det(el.dataset.id);
else if(a=="vid")vid(el.dataset.i);
else if(a=="sub"){sub=el.dataset.c;route()}
else if(a=="opt"){sel.s[+el.dataset.g]=+el.dataset.i;el.parentNode.querySelectorAll(".vc").forEach(function(b){b.classList.toggle("on",b==el)});$("#dp").innerHTML=ph()}
else if(a=="add"){add();toast("Ditambahkan ke keranjang ✓")}
else if(a=="buy")wa([{id:sel.p.id,s:sel.s.slice(),q:1}]);
else if(a=="cart")cartView();
else if(a=="inc"){cart[el.dataset.k].q++;save();cartView()}
else if(a=="dec"){var i=cart[el.dataset.k];if(--i.q<1)cart.splice(el.dataset.k,1);save();cartView()}
else if(a=="co")wa(cart);
else if(a=="close"){$("#ov").hidden=true;$("#sh").innerHTML=""}});
$("#q").addEventListener("input",function(e){q=e.target.value.toLowerCase().trim();route()});
window.addEventListener("hashchange",function(){q="";$("#q").value="";$("#ov").hidden=true;$("#sh").innerHTML="";route(true)});
$("#nc").href="https://wa.me/"+WA;
try{cart=JSON.parse(localStorage.getItem("fs_cart2")||"[]").filter(function(i){return byId(i.id)})}catch(e){cart=[]}
save();route();
</script>
</body>
</html>
